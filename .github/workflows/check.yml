name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned toolchains
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          rustup default 1.99.0
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter clone failed' }
          git -C "$env:RUNNER_TEMP/flutter" checkout 5fc346839b5d0eef006ed8404392afb4dfae428d
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Flutter checkout failed' }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check source and build profiles
        shell: pwsh
        run: |
          python scripts/check-source-release.py --staged --history
          if ($LASTEXITCODE -ne 0) { throw 'Source audit failed' }
          python scripts/test-source-configuration.py
          if ($LASTEXITCODE -ne 0) { throw 'Configuration tests failed' }
          python scripts/test-release-tools.py
          if ($LASTEXITCODE -ne 0) { throw 'Release tool tests failed' }
          ./scripts/test-build-profile.ps1
          ./scripts/build-public-android.ps1 -CheckOnly
      - name: Rust and Flutter checks (no API keys, device, signing or APK)
        shell: pwsh
        run: ./scripts/test.ps1
